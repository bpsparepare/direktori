name: Build macOS

# Build aplikasi macOS (.app + .dmg) di runner macOS milik GitHub, sehingga
# bisa dipakai walaupun development sehari-hari dilakukan di Windows.
#
# Jalankan manual: tab "Actions" > "Build macOS" > "Run workflow".
# Hasil build bisa diunduh pada bagian "Artifacts" di halaman run tersebut.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan file environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          UPLOAD_API_BASE_URL: ${{ secrets.UPLOAD_API_BASE_URL }}
          UPLOAD_API_UPLOAD_PATH: ${{ secrets.UPLOAD_API_UPLOAD_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY belum diisi di Settings > Secrets and variables > Actions."
            exit 1
          fi
          UPLOAD_BASE="${UPLOAD_API_BASE_URL:-https://api.parepare.stat7300.net}"
          UPLOAD_PATH="${UPLOAD_API_UPLOAD_PATH:-/upload}"

          # assets/env dibutuhkan karena terdaftar sebagai asset di pubspec.yaml.
          mkdir -p assets env
          cat > assets/env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          UPLOAD_API_BASE_URL=${UPLOAD_BASE}
          UPLOAD_API_UPLOAD_PATH=${UPLOAD_PATH}
          EOF

          # env/env.local.json dipakai lewat --dart-define-from-file.
          python3 - <<'PY'
          import json, os
          data = {
              "SUPABASE_URL": os.environ["SUPABASE_URL"],
              "SUPABASE_ANON_KEY": os.environ["SUPABASE_ANON_KEY"],
              "GOOGLE_CLIENT_ID": os.environ.get("GOOGLE_CLIENT_ID", ""),
              "UPLOAD_API_BASE_URL": os.environ.get("UPLOAD_API_BASE_URL") or "https://api.parepare.stat7300.net",
              "UPLOAD_API_UPLOAD_PATH": os.environ.get("UPLOAD_API_UPLOAD_PATH") or "/upload",
          }
          with open("env/env.local.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Build .app + .dmg
        run: ./scripts/build_macos.sh

      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: direktori-macos
          path: |
            dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 30
